apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: shopping-ingress
  namespace: microservices-demo

spec:
  ingressClassName: nginx

  rules:
    - host: onlineshop-amir.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /order
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5002

          # Product API
          - path: /product
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 5001